<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06070a" />
  <meta name="description" content="4 & | 2 — la community di chi ama viaggiare su 4 e 2 ruote. Percorsi, record, eventi e mappa live." />
  <title>4 &amp; | 2 — Mappa</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <div id="app-loader"><div class="spinner"></div></div>

  <div class="map-root">
    <div id="map"></div>
  </div>

  <!-- Radar di prossimità (stile arcade), sotto la topbar: compare quando un
       percorso o un evento è vicino e suona sempre più fitto avvicinandosi.
       Toccalo per il check-in o per registrare un tentativo. Vedi home.js -->
  <button id="radar" class="radar" type="button" hidden aria-label="Bersaglio vicino">
    <span class="radar-disc">
      <span class="radar-sweep"></span>
      <span class="radar-ring r1"></span>
      <span class="radar-ring r2"></span>
      <span class="radar-blip"><i></i></span>
      <span class="radar-me"></span>
    </span>
    <span class="radar-info">
      <span class="radar-kind"></span>
      <span class="radar-name"></span>
      <span class="radar-dist"></span>
    </span>
  </button>

  <!-- Pulsanti flottanti mappa (stack a destra, sopra la bottom nav) -->
  <div class="map-fab-stack">
    <!-- Solo Mappa: nascosto finché DRIVE_MODE_ENABLED è false (vedi constants.js) -->
    <button id="fab-drive" class="map-fab" hidden aria-label="Modalità Solo Mappa" title="Solo Mappa"></button>
    <!-- Condivisione della posizione con gli amici: acceso = ti vedono (vedi home.js) -->
    <button id="fab-live" class="map-fab" aria-label="Condividi la posizione con gli amici" title="Condividi la tua posizione con gli amici"></button>
    <button id="fab-locate" class="map-fab" aria-label="La mia posizione" title="La mia posizione"></button>
  </div>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
